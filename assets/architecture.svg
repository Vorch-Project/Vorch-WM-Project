      .label { font-size: 18px; font-weight: 600; } .small { font-size: 15px; }
      .tiny { font-size: 13px; } .muted { fill: #647086; } .white { fill: #fff; }
      .box { stroke-width: 2; }
      .line { fill: none; stroke: #607087; stroke-width: 3; marker-end: url(#arrow); }
      .vline { fill: none; stroke: #3478D4; stroke-width: 3; marker-end: url(#arrow-v); }
